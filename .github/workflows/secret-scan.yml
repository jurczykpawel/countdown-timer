name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    # Deleting a ref introduces no commits and cannot be checked out.
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select scan range
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base=''
          head=''
          case "$EVENT" in
            push) base="$PUSH_BASE"; head="$PUSH_HEAD" ;;
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            schedule|workflow_dispatch) ;;
            *) echo 'Unsupported event' >&2; exit 1 ;;
          esac

          if [[ -n "$head" ]]; then
            [[ "$head" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${head}^{commit}"
            # New branches, BASE==HEAD and unavailable/divergent force-push
            # bases fall back to the entire head history, never an empty diff.
            if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] ||
               [[ "$base" == "$head" ]] ||
               ! git cat-file -e "${base}^{commit}" 2>/dev/null ||
               ! git merge-base --is-ancestor "$base" "$head"; then
              echo '::notice::Scanning entire head history: no usable ancestor base'
              base=''
            fi
          fi

          # checkout fetch-depth: 0 fetches all branch/tag history. For scheduled
          # and manual runs both inputs stay empty: the action uses no branch or
          # since-commit filter and scans all fetched refs, avoiding BASE==HEAD.
          # For push/PR a nonempty head prevents the action's event auto-range
          # logic from replacing our full-head fallback with an invalid base.
          printf 'base=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"

      - name: Scan secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          version: '3.99.8'
          extra_args: --results=verified,unknown
